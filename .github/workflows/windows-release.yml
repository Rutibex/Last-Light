name: Build Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Lastlight.sln
      - name: Build solution
        run: dotnet build Lastlight.sln -c Release --no-restore
      # Windows RID publish performs its own restore to fetch RID-specific assets.
      - name: Publish self-contained x64
        run: dotnet publish src/Lastlight.Desktop/Lastlight.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/Windows-x64
      - name: Package player files and checksums
        shell: pwsh
        run: |
          Copy-Item player/Run-Lastlight.bat artifacts/Windows-x64/Run-Lastlight.bat
          Copy-Item player/README-WINDOWS.txt artifacts/Windows-x64/README-WINDOWS.txt
          Copy-Item LICENSE artifacts/Windows-x64/LICENSE
          Copy-Item RELEASE_NOTES.md artifacts/Windows-x64/RELEASE_NOTES.md
          if (!(Test-Path artifacts/Windows-x64/Assets/definitions.json)) { throw "Published gameplay assets missing" }
          if (!(Test-Path artifacts/Windows-x64/Assets/font.png)) { throw "Published font atlas missing" }
          Copy-Item -Recurse licenses artifacts/Windows-x64/licenses
          Compress-Archive -Path artifacts/Windows-x64/* -DestinationPath artifacts/Lastlight-Windows-x64.zip -Force
          $hash = (Get-FileHash artifacts/Lastlight-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Lastlight-Windows-x64.zip" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Lastlight-Windows-x64
          path: |
            artifacts/Lastlight-Windows-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Publish prerelease for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" artifacts/Lastlight-Windows-x64.zip artifacts/SHA256SUMS.txt --title "Lastlight ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
